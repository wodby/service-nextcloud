name: nextcloud
icon: nextcloud
title: Nextcloud
type: service
scalable: false

labels:
- nextcloud
- collaboration
- file-sharing

options:
- version: '34'
  tag: 34.0.6-apache
  digest: sha256:7563884d167edc55a85c8e5a261f52b10b0eb8c380d02f0c10d1cec7619003c4
  default: true
  eol: '2027-06-30T00:00:00+00:00'
- version: '33'
  tag: 33.0.11-apache

  digest: sha256:293744abb460e5e1b07a3bd730a687003d1e0c45bdce6645e3c54075e83479ae
  eol: '2027-02-28T00:00:00+00:00'
endpoints:
- name: nextcloud
  workload: main
  ports:
  - name: http
    main: true
    number: 8080
    protocol: http
    routeDefaults:
      request_timeout: 1h
      backend_request_timeout: 1h

settings:
# Named admin-username, not admin-user: admin-user was a secret setting in earlier revisions, and Wodby does not let a
# secret setting become a plain one under the same name.
- name: admin-username
  title: Admin username
  description: Username for the initial Nextcloud administrator account.
  default: admin
  required: true
  # Reaches the chart through the NEXTCLOUD_ADMIN_USER variable below.
  var: ''
- name: admin-password
  title: Admin password
  description: Password for the initial Nextcloud administrator account.
  required: true
  secret: true
  var: NEXTCLOUD_ADMIN_PASSWORD
- name: php-memory-limit
  title: PHP memory limit
  description: Maximum memory available to one PHP process.
  default: 512M
  var: PHP_MEMORY_LIMIT
- name: php-upload-limit
  title: PHP upload limit
  description: Maximum size accepted by PHP for one upload request.
  default: 3G
  var: PHP_UPLOAD_LIMIT
- name: apache-body-limit
  title: Apache request body limit
  description: Maximum request body in bytes. Use 0 for unlimited; Wodby route limits still apply.
  default: '0'
  var: APACHE_BODY_LIMIT
- name: mail-from-address
  title: Mail sender
  description: Local part of the address used for outgoing Nextcloud email.
  default: nextcloud
  var: MAIL_FROM_ADDRESS
- name: mail-domain
  title: Mail domain
  description: Domain appended to the mail sender address.
  default: '{{service.primaryHost}}'
  var: MAIL_DOMAIN
- name: s3-bucket
  title: S3 bucket
  description: Name of an existing, empty bucket dedicated to this Nextcloud installation. Attach a compatible S3 integration and set this before the first deployment to use primary object storage.
  placeholder: nextcloud-files
  var: NEXTCLOUD_S3_BUCKET
- name: trusted-proxies
  title: Trusted proxies
  description: Optional space-separated proxy IP addresses or CIDR ranges trusted for forwarded client headers.
  placeholder: 10.0.0.0/8
  var: TRUSTED_PROXIES
- name: maintenance-window-start
  title: Maintenance window start
  description: Hour (0-23, UTC) when Nextcloud starts its six-hour window for heavy daily background jobs. Leave empty to run them at any time.
  default: '1'
  var: NEXTCLOUD_MAINTENANCE_WINDOW_START
- name: default-phone-region
  title: Default phone region
  description: Optional two-letter country code, such as US or DE, used for phone numbers entered without a country code.
  placeholder: US
  var: NEXTCLOUD_DEFAULT_PHONE_REGION

env:
- name: OVERWRITECLIURL
  value: '{{service.primaryURL}}'
- name: OVERWRITEPROTOCOL
  value: https
# The chart reads both admin keys from the app service's secret (nextcloud.existingSecret), which holds only secret
# variables. The username is not sensitive, so its setting stays visible and editable; this variable carries it into
# the secret.
- name: NEXTCLOUD_ADMIN_USER
  value: '{{settings.admin-username}}'
  secret: true

links:
- name: postgres
  title: PostgreSQL
  required: true
  selectors:
  - type: db
    labels:
    - postgres
  # The chart reads the database user and password from the app service's secret (externalDatabase.existingSecret),
  # which holds only secret variables, so both are secret.
  env:
  - name: NEXTCLOUD_DB_USER
    value: '{{link.database.user.name}}'
    secret: true
  - name: NEXTCLOUD_DB_PASSWORD
    value: '{{link.database.user.password}}'
    secret: true
  helm:
  - name: externalDatabase.host
    value: '{{link.database.host}}'
  - name: externalDatabase.database
    value: '{{link.database.db.name}}'
- name: redis
  title: Redis
  required: true
  selectors:
  - type: datastore
    labels:
    - redis
  env:
  - name: NEXTCLOUD_REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  helm:
  - name: externalRedis.host
    value: '{{link.host}}'
  - name: externalRedis.port
    value: '{{link.port}}'
- name: sendmail
  title: SMTP server
  selectors:
  - type: service
    labels:
    - smtp
  env:
  - name: SMTP_HOST
    value: '{{link.host}}'
  - name: SMTP_PORT
    value: '{{link.port}}'

integrations:
- name: s3
  title: S3 primary storage
  type: storage
  required: false
  labels:
  - s3
  providers:
  - name: aws
    env:
    - name: NEXTCLOUD_S3_ENABLED
      value: 'true'
    - name: NEXTCLOUD_S3_KEY
      value: '{{integration.variables.AWS_ACCESS_KEY_ID}}'
    - name: NEXTCLOUD_S3_SECRET
      value: '{{integration.variables.AWS_SECRET_ACCESS_KEY}}'
      secret: true
    - name: NEXTCLOUD_S3_REGION
      value: '{{integration.variables.AWS_REGION}}'
  - name: cloudflare
    env:
    - name: NEXTCLOUD_S3_ENABLED
      value: 'true'
    - name: NEXTCLOUD_S3_HOST
      value: '{{integration.fields.account_id}}.r2.cloudflarestorage.com'
    - name: NEXTCLOUD_S3_KEY
      value: '{{integration.fields.r2_access_key_id}}'
    - name: NEXTCLOUD_S3_SECRET
      value: '{{integration.fields.r2_secret_access_key}}'
      secret: true
    - name: NEXTCLOUD_S3_REGION
      value: auto
    - name: NEXTCLOUD_S3_PATH_STYLE
      value: 'true'
  - name: backblaze
    env:
    - name: NEXTCLOUD_S3_ENABLED
      value: 'true'
    - name: NEXTCLOUD_S3_HOST
      value: '{{integration.fields.endpoint}}'
    - name: NEXTCLOUD_S3_KEY
      value: '{{integration.fields.application_key_id}}'
    - name: NEXTCLOUD_S3_SECRET
      value: '{{integration.fields.application_key}}'
      secret: true
    - name: NEXTCLOUD_S3_PATH_STYLE
      value: 'true'

volumes:
- name: data
  title: Nextcloud data
  size: 50
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'
    - name: persistence.existingClaim
      value: '{{volumes.data.claim}}'

helm:
  name: nextcloud
  source: https://nextcloud.github.io/helm/
  chart: nextcloud/nextcloud
  version: 9.4.5
  valueMappings:
    replicas: replicaCount
    nameOverride: nameOverride
    fullnameOverride: fullnameOverride
    strategy: nextcloud.strategy
  values:
  - name: internalDatabase.enabled
    value: false
  - name: externalDatabase.enabled
    value: true
  - name: externalDatabase.type
    value: postgresql
  - name: externalDatabase.existingSecret.enabled
    value: true
  - name: externalDatabase.existingSecret.secretName
    value: '{{service.secrets.env}}'
  - name: externalDatabase.existingSecret.usernameKey
    value: NEXTCLOUD_DB_USER
  - name: externalDatabase.existingSecret.passwordKey
    value: NEXTCLOUD_DB_PASSWORD
  - name: externalRedis.enabled
    value: true
  - name: externalRedis.existingSecret.enabled
    value: true
  - name: externalRedis.existingSecret.secretName
    value: '{{service.secrets.env}}'
  - name: externalRedis.existingSecret.passwordKey
    value: NEXTCLOUD_REDIS_PASSWORD
  - name: mariadb.enabled
    value: false
  - name: postgresql.enabled
    value: false
  - name: redis.enabled
    value: false
  - name: collabora.enabled
    value: false
  - name: imaginary.enabled
    value: false
  - name: metrics.enabled
    value: false
  - name: ingress.enabled
    value: false
  - name: httpRoute.enabled
    value: false
  - name: hpa.enabled
    value: false
  - name: nginx.enabled
    value: false
  - name: cronjob.enabled
    value: true
  - name: cronjob.type
    value: sidecar
  # The sidecar starts together with the first installation. Its first cron run could fail with "Not installed" and
  # keep an error on the admin overview for a week, so crond starts only once config.php marks Nextcloud installed.
  - name: cronjob.sidecar.command
    value:
    - /bin/sh
    - -c
    - |-
      until php -r 'include "/var/www/html/config/config.php"; exit(empty($CONFIG["installed"]) ? 1 : 0);' >/dev/null 2>&1; do
        sleep 10
      done
      exec /cron.sh
  # The image runs these scripts as www-data after it installs or upgrades Nextcloud; a failing script stops the
  # container, so every step tolerates failure. A fresh database is small, so the installation hook finishes the
  # optional database maintenance (missing indices, mimetype migrations) at once. It also disables AppAPI, which
  # needs a deploy daemon that this service does not provide; administrators can enable it after registering one.
  #
  # Both hooks delete the theming app's MigrateBackgroundImages job, which `maintenance:repair` and `occ upgrade`
  # queue. It moves backgrounds left by the dashboard of Nextcloud 25 and older, which an installation of this service
  # never has, and it fails with NotFoundException when the theming app has no global folder, logging an error that
  # stays on the admin overview for a week. `background-job:delete` always asks for confirmation; SHELL_INTERACTIVE
  # lets it read the answer from the pipe.
  - name: nextcloud.hooks.post-installation
    value: |-
      #!/bin/sh
      occ="php /var/www/html/occ"
      delete_background_migration_jobs() {
        $occ background-job:list --class='OCA\Theming\Jobs\MigrateBackgroundImages' --output=json \
          | php -r 'foreach ((array) json_decode(stream_get_contents(STDIN), true) as $job) { echo $job["id"], PHP_EOL; }' \
          | while read -r id; do printf 'y\n' | SHELL_INTERACTIVE=1 $occ background-job:delete "$id"; done
      }
      $occ db:add-missing-indices || true
      $occ maintenance:repair --include-expensive || true
      delete_background_migration_jobs || true
      $occ app:disable app_api || true
  # On an existing installation the same maintenance can take long enough to exceed the startup probe, so it runs in
  # the background while Apache starts.
  - name: nextcloud.hooks.post-upgrade
    value: |-
      #!/bin/sh
      occ="php /var/www/html/occ"
      delete_background_migration_jobs() {
        $occ background-job:list --class='OCA\Theming\Jobs\MigrateBackgroundImages' --output=json \
          | php -r 'foreach ((array) json_decode(stream_get_contents(STDIN), true) as $job) { echo $job["id"], PHP_EOL; }' \
          | while read -r id; do printf 'y\n' | SHELL_INTERACTIVE=1 $occ background-job:delete "$id"; done
      }
      delete_background_migration_jobs || true
      (
        $occ db:add-missing-indices
        $occ maintenance:repair --include-expensive
        delete_background_migration_jobs
      ) </dev/null &
  - name: nextcloud.host
    value: '{{service.primaryHost}}'
  - name: nextcloud.existingSecret.enabled
    value: true
  - name: nextcloud.existingSecret.secretName
    value: '{{service.secrets.env}}'
  - name: nextcloud.existingSecret.usernameKey
    value: NEXTCLOUD_ADMIN_USER
  - name: nextcloud.existingSecret.passwordKey
    value: NEXTCLOUD_ADMIN_PASSWORD
  # Nextcloud upgrades its database before Apache starts, which can take many minutes. The startup probe holds the
  # liveness probe off for up to about 15 minutes so that an upgrade is not killed halfway.
  - name: startupProbe.enabled
    value: true
  - name: startupProbe.failureThreshold
    value: 90
  - name: phpClientHttpsFix.enabled
    value: true
  - name: phpClientHttpsFix.protocol
    value: https
  - name: nextcloud.configs
    value:
      wodby.config.php: |-
        <?php

        $hosts = json_decode((string) getenv('WODBY_HOSTS'), true);
        if (!is_array($hosts)) {
            $hosts = array();
        }

        $primaryHost = getenv('WODBY_PRIMARY_HOST');
        if ($primaryHost) {
            $hosts[] = $primaryHost;
        }

        $hosts = array_values(array_unique(array_filter($hosts, 'is_string')));
        if ($hosts) {
            $CONFIG['trusted_domains'] = $hosts;
        }

        // The service runs one Nextcloud server (web and cron share it), so a fixed identifier is valid.
        $CONFIG['serverid'] = 0;

        $maintenanceWindowStart = trim((string) getenv('NEXTCLOUD_MAINTENANCE_WINDOW_START'));
        if (preg_match('/^([01]?[0-9]|2[0-3])$/', $maintenanceWindowStart)) {
            $CONFIG['maintenance_window_start'] = (int) $maintenanceWindowStart;
        }

        $defaultPhoneRegion = strtoupper(trim((string) getenv('NEXTCLOUD_DEFAULT_PHONE_REGION')));
        if (preg_match('/^[A-Z]{2}$/', $defaultPhoneRegion)) {
            $CONFIG['default_phone_region'] = $defaultPhoneRegion;
        }

        $s3Enabled = filter_var(getenv('NEXTCLOUD_S3_ENABLED'), FILTER_VALIDATE_BOOLEAN);
        $s3Bucket = trim((string) getenv('NEXTCLOUD_S3_BUCKET'));
        if ($s3Enabled && $s3Bucket !== '') {
            $s3Arguments = array(
                'bucket' => $s3Bucket,
                'key' => (string) getenv('NEXTCLOUD_S3_KEY'),
                'secret' => (string) getenv('NEXTCLOUD_S3_SECRET'),
                'autocreate' => false,
                'use_ssl' => true,
                'use_path_style' => filter_var(getenv('NEXTCLOUD_S3_PATH_STYLE'), FILTER_VALIDATE_BOOLEAN),
            );

            $s3Host = trim((string) getenv('NEXTCLOUD_S3_HOST'));
            if ($s3Host !== '') {
                $s3Arguments['hostname'] = $s3Host;
                $s3Arguments['port'] = 443;
            }

            $s3Region = trim((string) getenv('NEXTCLOUD_S3_REGION'));
            if ($s3Region === '' && preg_match('/^s3\.([^.]+)\.backblazeb2\.com$/', $s3Host, $matches)) {
                $s3Region = $matches[1];
            }
            if ($s3Region !== '') {
                $s3Arguments['region'] = $s3Region;
            }

            $CONFIG['objectstore'] = array(
                'class' => '\\OC\\Files\\ObjectStore\\S3',
                'arguments' => $s3Arguments,
            );
        }

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
      app.kubernetes.io/component: app
  kind: deployment
  primary: true
  deployment:
    strategy: recreate
  helm:
    annotations: podAnnotations
    labels: podLabels
  containers:
  - name: nextcloud
    image: docker.io/library/nextcloud
    resources:
      request:
        cpu: 10
        memory: 80
    # Stock image, so Wodby passes the route hostnames only on request.
    # wodby.config.php turns WODBY_HOSTS into trusted_domains.
    routeMetadata: true
    helm:
      resources: resources
      env: nextcloud.extraEnv
      image:
        repository: image.repository
        tag: image.tag
        registry: image.registry
        pullPolicy: image.pullPolicy
  - name: nextcloud-cron
    resources:
      request:
        cpu: 10
        memory: 80
    helm:
      resources: cronjob.sidecar.resources
